name: Pruebas Godot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  juego:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot 4.3
        run: |
          curl -fLsS -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Importar modelos
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/import.log
      - name: Comprobar la partida
        run: |
          set +e
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --script res://tests/run_tests.gd 2>&1 | tee /tmp/tests.log
          result=${PIPESTATUS[0]}
          # El renderer dummy de Godot 4.3 emite este mensaje al liberar mallas;
          # se comprueban todos los demás errores y el código de salida del test.
          grep -v -e '^ERROR: Parameter "m" is null\.$' -e 'at: mesh_get_surface_count (servers/rendering/dummy/storage/mesh_storage.h:120)' /tmp/tests.log > /tmp/tests-clean.log
          if grep -Eq '^(SCRIPT ERROR|ERROR):' /tmp/tests-clean.log; then result=1; fi
          summary=$(grep 'Pruebas:' /tmp/tests-clean.log | tail -1)
          if [ -n "$summary" ]; then echo "::notice::$summary"; fi
          if [ "$result" -ne 0 ]; then
            # Publicar el diagnóstico también como anotación de la ejecución.
            log=$(grep -E '^(SCRIPT ERROR|ERROR:|FALLO:|Pruebas:| +at:)' /tmp/tests-clean.log | head -80)
            log="${log//'%'/'%25'}"
            log="${log//$'\n'/'%0A'}"
            log="${log//$'\r'/'%0D'}"
            echo "::error::$log"
          fi
          exit "$result"
      - name: Comprobar renderizado real
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          set +e
          export LIBGL_ALWAYS_SOFTWARE=1 TD_VISUAL_IMAGE=/tmp/tddefense-visual.jpg
          timeout 180 xvfb-run -a -s '-screen 0 1600x900x24' /tmp/godot/Godot_v4.3-stable_linux.x86_64 --audio-driver Dummy --rendering-method gl_compatibility --resolution 1600x900 --path godot --script res://tests/visual_smoke.gd 2>&1 | tee /tmp/visual.log
          result=${PIPESTATUS[0]}
          if grep -Eq '^(SCRIPT ERROR|ERROR|FALLO):' /tmp/visual.log; then result=1; fi
          summary=$(grep 'VISUAL:' /tmp/visual.log | tail -1)
          if [ -n "$summary" ]; then echo "::notice::$summary"; fi
          if [ "$result" -ne 0 ]; then
            log=$(grep -E '^(SCRIPT ERROR|ERROR:|FALLO:| +at:)' /tmp/visual.log | head -50)
            log="${log//'%'/'%25'}"
            log="${log//$'\n'/'%0A'}"
            log="${log//$'\r'/'%0D'}"
            echo "::error::$log"
          elif [ -s /tmp/tddefense-visual.jpg ]; then
            base64 -w0 /tmp/tddefense-visual.jpg | fold -w3000 | awk '{printf "::notice::TDIMG%03d:%s\n", NR, $0}'
          fi
          exit "$result"
