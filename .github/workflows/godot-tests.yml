name: Pruebas Godot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  juego:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot 4.3
        run: |
          curl -fLsS -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Importar modelos
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/import.log
      - name: Comprobar la partida
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --script res://tests/run_tests.gd 2>&1 | tee /tmp/tests.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/tests.log
